<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>AnythingLLM 文档上传</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
    h1 { font-size: 20px; }
    .info { color: #555; margin: 8px 0 16px; }
    .row { margin: 12px 0; }
    button { padding: 8px 16px; cursor: pointer; }
    #status { margin-top: 16px; white-space: pre-wrap; }
    .ok { color: green; }
    .err { color: #c00; }
  </style>
</head>
<body>
  <h1>上传文档到 AnythingLLM</h1>
  <div class="info" id="workspace">正在获取工作区…</div>
  <div class="row">
    <input type="file" id="file" />
  </div>
  <div class="row">
    <button id="upload" disabled>上传并嵌入</button>
  </div>
  <pre id="status"></pre>

  <script>
    const API_BASE = "http://localhost:3001/api";
    const API_KEY = "CE9VTQ6-JJFMGWX-PTWDR0A-R7F231W";
    const headers = { Authorization: `Bearer ${API_KEY}` };

    let firstSlug = null;

    async function loadWorkspace() {
      try {
        const res = await fetch(`${API_BASE}/v1/workspaces`, { headers });
        const data = await res.json();
        const ws = data.workspaces && data.workspaces[0];
        if (!ws) throw new Error("没有可用工作区");
        firstSlug = ws.slug;
        document.getElementById("workspace").textContent =
          `第一个工作区：${ws.name}（slug: ${ws.slug}）`;
        document.getElementById("upload").disabled = false;
      } catch (e) {
        document.getElementById("workspace").textContent = "获取工作区失败：" + e.message;
      }
    }

    async function upload() {
      const fileInput = document.getElementById("file");
      const status = document.getElementById("status");
      if (!fileInput.files[0]) { status.textContent = "请先选择文件"; return; }
      if (!firstSlug) { status.textContent = "工作区未就绪"; return; }

      const fd = new FormData();
      fd.append("file", fileInput.files[0]);
      fd.append("addToWorkspaces", firstSlug);

      status.textContent = "上传中…";
      try {
        const res = await fetch(`${API_BASE}/v1/document/upload`, {
          method: "POST",
          headers,
          body: fd
        });
        const data = await res.json();
        if (!res.ok || !data.success) throw new Error(data.error || `HTTP ${res.status}`);
        const doc = data.documents[0];
        status.className = "ok";
        status.textContent =
          `上传并嵌入成功！\n` +
          `标题：${doc.title}\n` +
          `位置：${doc.location}\n` +
          `词数：${doc.wordCount}\n` +
          `Token 估算：${doc.token_count_estimate}`;
      } catch (e) {
        status.className = "err";
        status.textContent = "上传失败：" + e.message;
      }
    }

    document.getElementById("upload").addEventListener("click", upload);
    loadWorkspace();
  </script>
</body>
</html>
